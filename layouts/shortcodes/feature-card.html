{{ $title := .Get "title" }}
{{ $icon := .Get "icon" | default "⚡" }}
<div class="card">
  <div class="text-2xl mb-3">{{ $icon }}</div>
  <h3 class="text-lg font-semibold mb-2" style="color: var(--color-text-heading);">{{ $title }}</h3>
  <p class="text-sm" style="color: var(--color-text-secondary);">{{ .Inner }}</p>
</div>
