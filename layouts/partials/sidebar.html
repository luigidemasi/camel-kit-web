<aside class="w-64 shrink-0 hidden lg:block overflow-y-auto sticky top-16 h-[calc(100vh-4rem)] py-6 pr-4" style="background-color: var(--color-sidebar-bg);">
  {{ $currentPage := . }}
  {{ $section := .FirstSection }}
  {{ if $section }}
  <nav class="text-sm space-y-1">
    <a href="{{ $section.RelPermalink }}" class="block px-3 py-1.5 rounded font-semibold no-underline" style="{{ if eq $currentPage.RelPermalink $section.RelPermalink }}color: var(--color-sidebar-active); background: var(--color-bg-secondary);{{ else }}color: var(--color-text-secondary);{{ end }}">
      {{ $section.Title }}
    </a>
    {{ range $section.Pages.ByWeight }}
    {{ if .IsSection }}
    <div class="mt-3">
      <div class="px-3 py-1 text-xs font-semibold uppercase tracking-wider" style="color: var(--color-text-secondary);">{{ .Title }}</div>
      {{ range .Pages.ByWeight }}
      <a href="{{ .RelPermalink }}" class="block px-3 py-1.5 rounded no-underline hover:opacity-80 {{ if eq $currentPage.RelPermalink .RelPermalink }}font-semibold{{ end }}" style="{{ if eq $currentPage.RelPermalink .RelPermalink }}color: var(--color-sidebar-active); background: var(--color-bg-secondary);{{ else }}color: var(--color-text-primary);{{ end }}">
        {{ .Title }}
      </a>
      {{ end }}
    </div>
    {{ else }}
    <a href="{{ .RelPermalink }}" class="block px-3 py-1.5 rounded no-underline hover:opacity-80 {{ if eq $currentPage.RelPermalink .RelPermalink }}font-semibold{{ end }}" style="{{ if eq $currentPage.RelPermalink .RelPermalink }}color: var(--color-sidebar-active); background: var(--color-bg-secondary);{{ else }}color: var(--color-text-primary);{{ end }}">
      {{ .Title }}
    </a>
    {{ end }}
    {{ end }}
  </nav>
  {{ end }}
</aside>
