{{ define "main" }}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex gap-0">
  {{ partial "sidebar.html" . }}
  <div class="flex-1 min-w-0 py-8 px-0 lg:px-8">
    <h1 class="text-3xl font-bold mb-2">{{ .Title }}</h1>
    {{ with .Description }}<p class="text-lg mb-6" style="color: var(--color-text-secondary);">{{ . }}</p>{{ end }}
    <div class="prose max-w-none mb-8">
      {{ .Content }}
    </div>
    {{ if .Pages }}
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      {{ range .Pages.ByWeight }}
      <a href="{{ .RelPermalink }}" class="card no-underline hover:shadow-md transition-shadow">
        <h3 class="text-lg font-semibold mb-1" style="color: var(--color-text-heading);">{{ .Title }}</h3>
        {{ with .Description }}<p class="text-sm" style="color: var(--color-text-secondary);">{{ . }}</p>{{ end }}
      </a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</div>
{{ end }}
